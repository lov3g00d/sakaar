#cloud-config
# Recipe for the "Web SQLi" machine. Provisioned once at build time; the VM
# powers itself off when done so the build step knows it's finished.

package_update: true
packages:
  - apache2
  - php
  - libapache2-mod-php
  - php-sqlite3
  - sqlite3
  - sudo
  - openssh-server

ssh_pwauth: true

users:
  - default
  - name: webadmin
    groups: [users]
    shell: /bin/bash
    lock_passwd: false

write_files:
  # Vulnerable login: user/pass are concatenated straight into the SQL query.
  - path: /var/www/html/index.php
    content: |
      <?php
      $db = new SQLite3('/opt/app/users.db');
      $msg = '';
      if (isset($_POST['user'])) {
        $u = $_POST['user']; $p = $_POST['pass'];
        $q = "SELECT user,note FROM users WHERE user='$u' AND pass='$p'";
        $row = @$db->query($q)->fetchArray();
        if ($row) { $msg = "<h2>Welcome, ".$row['user']."</h2><p>Ops note: ".$row['note']."</p>"; }
        else { $msg = "<p>Invalid credentials.</p>"; }
      }
      ?>
      <!doctype html><title>Ops Portal</title>
      <h1>Ops Portal</h1><?= $msg ?>
      <form method=post>
        user <input name=user> pass <input name=pass type=password>
        <button>login</button>
      </form>
  # Intended privilege escalation: passwordless sudo find (GTFOBins).
  - path: /etc/sudoers.d/webadmin
    content: "webadmin ALL=(root) NOPASSWD: /usr/bin/find\n"
    permissions: '0440'
  # Generate a strong password at build and leak it through the SQLi note, so
  # the injection is the only foothold - a weak, rockyou-crackable password
  # would let an attacker skip the vuln by brute-forcing SSH. Logic lives in a
  # script (not runcmd) so the password text can't be misparsed as YAML.
  - path: /opt/app/setup.sh
    permissions: '0700'
    content: |
      #!/bin/bash
      set -eu
      pw=$(LC_ALL=C tr -dc 'A-Za-z0-9' </dev/urandom | head -c 20)
      hash=$(LC_ALL=C tr -dc a-f0-9 </dev/urandom | head -c 16)
      echo "webadmin:$pw" | chpasswd
      mkdir -p /opt/app
      sqlite3 /opt/app/users.db <<SQL
      CREATE TABLE users(user TEXT, pass TEXT, note TEXT);
      INSERT INTO users VALUES('admin','$hash','Maintenance account webadmin, SSH password is $pw');
      SQL
      chown -R www-data:www-data /opt/app

runcmd:
  - bash /opt/app/setup.sh
  - rm -f /opt/app/setup.sh
  - chown -R www-data:www-data /var/www/html
  - rm -f /var/www/html/index.html
  - systemctl enable --now apache2 ssh

power_state:
  mode: poweroff
  timeout: 60
  condition: true
